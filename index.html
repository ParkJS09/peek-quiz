<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구멍 엿보기 퀴즈</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🔍 구멍 엿보기 퀴즈</h1>
    <button id="meChip" class="me-chip" hidden></button>
  </header>

  <nav class="tabs page-tabs" id="mainTabs" hidden>
    <button class="tab active" data-view="list">문제</button>
    <button class="tab" data-view="rank">랭킹</button>
  </nav>

  <!-- 닉네임 등록 -->
  <main id="view-join" class="page narrow" hidden>
    <section class="card join">
      <div class="join-icon">🕳️👀</div>
      <h2>닉네임을 정하고 시작하세요</h2>
      <p class="muted">구멍으로 살짝 보이는 그림이 무엇인지 맞히는 게임이에요.<br>힌트(구멍)를 적게 볼수록 점수가 높아요.</p>
      <form id="joinForm" class="stack">
        <input id="nickInput" type="text" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="off">
        <button class="btn primary" type="submit">시작하기</button>
      </form>
      <details class="recover">
        <summary>다른 기기에서 하던 걸 이어서 할래요</summary>
        <form id="recoverForm" class="stack">
          <input id="recoverInput" type="text" placeholder="복구 코드 붙여넣기" autocomplete="off">
          <button class="btn" type="submit">이어하기</button>
        </form>
      </details>
    </section>
  </main>

  <!-- 문제 목록 -->
  <main id="view-list" class="page" hidden>
    <div id="dayList" class="day-list"></div>
  </main>

  <!-- 문제 풀기 -->
  <main id="view-play" class="view" hidden>
    <section class="stage-wrap">
      <div class="canvas-box play-box" id="playBox">
        <img id="playImg" alt="퀴즈 이미지">
      </div>
    </section>
    <aside class="panel">
      <div class="muted small" id="playTitle"></div>
      <div class="stage-label" id="stageLabel"></div>
      <div class="steps" id="steps"></div>
      <div class="score-box">
        <div class="muted small" id="scoreCaption"></div>
        <div class="score" id="score"></div>
      </div>
      <form id="guessForm" class="guess">
        <input id="guessInput" type="text" placeholder="정답을 입력하세요" autocomplete="off">
        <button class="btn primary" type="submit">제출</button>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="actions">
        <button id="nextBtn" class="btn">다음 힌트 →</button>
        <button id="giveUpBtn" class="btn ghost">포기하고 정답 보기</button>
        <button id="backBtn" class="btn ghost">← 목록으로</button>
      </div>
    </aside>
  </main>

  <!-- 랭킹 -->
  <main id="view-rank" class="page narrow" hidden>
    <section class="card">
      <div class="row-between">
        <h2>🏆 랭킹</h2>
        <button id="rankRefresh" class="btn ghost small-btn">새로고침</button>
      </div>
      <table class="rank-table">
        <thead><tr><th>순위</th><th>닉네임</th><th>맞힌 문제</th><th>점수</th></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
      <p id="rankEmpty" class="muted" hidden>아직 정답자가 없어요. 첫 번째 주인공이 되어 보세요!</p>
    </section>
  </main>

  <!-- 내 정보 -->
  <dialog id="meDialog" class="dialog">
    <h3 id="meName"></h3>
    <p class="muted small">총점 <b id="meTotal"></b> · 맞힌 문제 <b id="meSolved"></b>개</p>
    <label class="small">복구 코드 (다른 기기에서 이어할 때 필요해요. 남에게 보여주지 마세요)</label>
    <div class="code-row">
      <input id="meCode" type="text" readonly>
      <button id="copyCode" class="btn">복사</button>
    </div>
    <div class="actions">
      <button id="logoutBtn" class="btn ghost">이 기기에서 로그아웃</button>
      <button id="closeMe" class="btn primary">닫기</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="player.js"></script>
</body>
</html>
